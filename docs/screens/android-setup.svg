<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 620" width="852" height="620" role="img" aria-labelledby="ttl desc">
  <title id="ttl">ESP-Drone Android app — Setup screen</title>
  <desc id="desc">The Setup screen (PreferencesActivity): grouped preference rows for the drone link (connection method, UDP host and the two UDP ports), flight control (mode, deadzone, trims, advanced flight control), controller (touch or gamepad with the mapping screen) and app settings, plus the Origin Project license entry.</desc>

  <defs>
    <style>
      .bg      { fill: #f6f8fa; }
      .h2      { font: 700 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1f2328; }
      .lbl     { font: 500 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1f2328; }
      .lblm    { font: 400 12px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #57606a; }
      .lblw    { font: 600 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #ffffff; }
      .mono    { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip    { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0969da; }
      .bezel   { fill: #1c2128; }
      .screen  { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
      .panel   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .btn     { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .btn-pri { fill: #1a7f37; stroke: #1a7f37; stroke-width: 1.5; }
      .rule    { stroke: #d0d7de; stroke-width: 1; }
      .tag     { font: 600 11px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1a7f37; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="852" height="620"/>

  <text class="h2" x="28" y="26">Setup screen</text>
  <text class="lblm" x="132" y="26">PreferencesActivity · the stock preference screens</text>

  <rect class="bezel" x="28" y="40" width="796" height="560" rx="18"/>
  <rect class="screen" x="40" y="52" width="772" height="536" rx="8"/>

  <!-- title bar -->
  <text class="lbl" x="56" y="78">Crazyflie Client settings</text>
  <line class="rule" x1="40" y1="90" x2="812" y2="90"/>

  <!-- ============================ drone link ============================ -->
  <text class="tag" x="56" y="116">DRONE LINK</text>
  <text class="lbl" x="56" y="142">Connection method</text>
  <rect class="btn" x="560" y="126" width="236" height="24" rx="6"/><text class="lblm" x="678" y="142" text-anchor="middle">WiFi SoftAP (drone hosts ESP-Drone)  ▾</text>
  <text class="lbl" x="56" y="176">UDP host</text>
  <rect class="panel" x="560" y="160" width="236" height="24" rx="6"/><text class="mono" x="790" y="177" text-anchor="end">192.168.43.42</text>
  <text class="lbl" x="56" y="210">UDP port (phone to drone)</text>
  <rect class="panel" x="560" y="194" width="236" height="24" rx="6"/><text class="mono" x="790" y="211" text-anchor="end">2390</text>
  <text class="lbl" x="56" y="244">UDP port (drone to phone)</text>
  <rect class="panel" x="560" y="228" width="236" height="24" rx="6"/><text class="mono" x="790" y="245" text-anchor="end">2399</text>
  <text class="lblm" x="56" y="270">SoftAP: 192.168.43.42. Station: esp-drone.local</text>
  <text class="lblm" x="56" y="288">Hold keeps a thrust level, not an altitude: no barometer. AUTO is takeoff-hover-land.</text>

  <!-- ============================ flight control ============================ -->
  <text class="tag" x="56" y="318">FLIGHT CONTROL SETTINGS</text>
  <text class="lbl" x="56" y="344">Mode</text>
  <rect class="btn" x="560" y="328" width="236" height="24" rx="6"/><text class="lblm" x="678" y="344" text-anchor="middle">Mode 2 (Left: Thrust &amp; Yaw, Right: Pitch &amp; Roll)  ▾</text>
  <text class="lbl" x="56" y="378">Deadzone</text>
  <rect class="panel" x="560" y="362" width="236" height="24" rx="6"/><text class="mono" x="790" y="379" text-anchor="end">0.2</text>
  <text class="lbl" x="56" y="412">Roll trim · Pitch trim</text>
  <rect class="panel" x="560" y="396" width="236" height="24" rx="6"/><text class="mono" x="790" y="413" text-anchor="end">0.0 · 0.0</text>
  <text class="lbl" x="56" y="446">Advanced flight control</text>
  <rect class="btn-pri" x="726" y="430" width="70" height="24" rx="6"/><text class="lblw" x="761" y="446" text-anchor="middle">☑ on</text>
  <text class="lblm" x="56" y="472">Advanced: max roll/pitch 15° · max yaw 90° · thrust 25–90 % · X-Mode on · Reset values</text>

  <!-- ============================ controller ============================ -->
  <text class="tag" x="56" y="500">CONTROLLER SETTINGS · APP SETTINGS</text>
  <text class="lbl" x="56" y="526">Controller</text>
  <rect class="btn" x="560" y="510" width="236" height="24" rx="6"/><text class="lblm" x="678" y="526" text-anchor="middle">Touch  ▾</text>
  <text class="lbl" x="56" y="558">Gamepad mapping ›</text>
  <text class="lblm" x="240" y="558">axes + Emergency / trims / Alt 1 / Alt 2 / Hover</text>
  <text class="lblm" x="56" y="578">Screen rotation lock ☑ · Full screen mode ☑ · Show console ☑ · Origin Project — GPL v2 ›</text>
</svg>
