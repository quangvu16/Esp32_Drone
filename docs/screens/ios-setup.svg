<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 620" width="852" height="620" role="img" aria-labelledby="ttl desc">
  <title id="ttl">ESP-Drone iOS app — Setup screens</title>
  <desc id="desc">Setup on iOS is an action sheet with two entries. Link — Wi-Fi or Bluetooth opens the Connection form sheet with the four link types, host and ports; Bluetooth Classic SPP is listed but reports Not available on iOS. Sticks and sensitivity opens the settings screen with the Slow, Fast and Custom sensitivity presets, the three rate fields, the control mode segments and the stick map.</desc>

  <defs>
    <style>
      .bg      { fill: #f6f8fa; }
      .h2      { font: 700 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1f2328; }
      .lbl     { font: 500 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1f2328; }
      .lblm    { font: 400 12px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #57606a; }
      .lblw    { font: 600 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #ffffff; }
      .mono    { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .bezel   { fill: #1c2128; }
      .screen  { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
      .panel   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .btn     { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .btn-pri { fill: #0969da; stroke: #0969da; stroke-width: 1.5; }
      .seg     { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .seg-on  { fill: #0969da; stroke: #0969da; stroke-width: 1.5; }
      .rule    { stroke: #d0d7de; stroke-width: 1; }
      .tag     { font: 600 11px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #0969da; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="852" height="620"/>

  <text class="h2" x="28" y="26">Setup</text>
  <text class="lblm" x="92" y="26">the Setup chip opens an action sheet — Link · Sticks and sensitivity</text>

  <!-- ============================ action sheet ============================ -->
  <rect class="panel" x="28" y="40" width="220" height="132" rx="12"/>
  <text class="lblm" x="138" y="62" text-anchor="middle">Setup</text>
  <rect class="btn" x="36" y="72" width="204" height="28" rx="6"/><text class="lbl" x="138" y="90" text-anchor="middle">Link — Wi-Fi or Bluetooth</text>
  <rect class="btn" x="36" y="104" width="204" height="28" rx="6"/><text class="lbl" x="138" y="122" text-anchor="middle">Sticks and sensitivity</text>
  <rect class="btn" x="36" y="136" width="204" height="28" rx="8"/><text class="lbl" x="138" y="154" text-anchor="middle">Cancel</text>

  <!-- ============================ connection form sheet ============================ -->
  <text class="h2" x="28" y="212">Link — Wi-Fi or Bluetooth</text>
  <text class="lblm" x="252" y="212">ConnectionViewController · form sheet</text>

  <rect class="bezel" x="28" y="226" width="390" height="374" rx="14"/>
  <rect class="screen" x="38" y="236" width="370" height="354" rx="8"/>

  <rect class="btn" x="50" y="248" width="60" height="22" rx="6"/><text class="lblm" x="80" y="263" text-anchor="middle">Cancel</text>
  <rect class="btn-pri" x="336" y="248" width="60" height="22" rx="6"/><text class="lblw" x="366" y="263" text-anchor="middle">Apply</text>
  <text class="lbl" x="183" y="263" text-anchor="middle">Connection</text>
  <line class="rule" x1="38" y1="278" x2="408" y2="278"/>

  <rect class="seg-on" x="50" y="290" width="82" height="22" rx="6"/><text class="lblm" x="91" y="305" text-anchor="middle">SoftAP</text>
  <rect class="seg" x="136" y="290" width="82" height="22" rx="6"/><text class="lblm" x="177" y="305" text-anchor="middle">Station</text>
  <rect class="seg" x="222" y="290" width="60" height="22" rx="6"/><text class="lblm" x="252" y="305" text-anchor="middle">SPP</text>
  <rect class="seg" x="286" y="290" width="60" height="22" rx="6"/><text class="lblm" x="316" y="305" text-anchor="middle">BLE</text>
  <text class="lblm" x="50" y="334">Join the drone's ESP-Drone network. Drone at 192.168.43.42,</text>
  <text class="lblm" x="50" y="352">UDP 2390 out / 2399 in.</text>

  <text class="lbl" x="50" y="382">Host</text>
  <rect class="panel" x="50" y="390" width="346" height="24" rx="6"/><text class="mono" x="386" y="407" text-anchor="end">192.168.43.42</text>
  <text class="lblm" x="50" y="432">192.168.43.42 or esp-drone.local</text>

  <text class="lbl" x="50" y="460">Drone UDP port</text>
  <rect class="panel" x="50" y="468" width="160" height="24" rx="6"/><text class="mono" x="200" y="485" text-anchor="end">2390</text>
  <text class="lbl" x="236" y="460">Phone UDP port</text>
  <rect class="panel" x="236" y="468" width="160" height="24" rx="6"/><text class="mono" x="386" y="485" text-anchor="end">2399</text>

  <text class="lbl" x="50" y="520" fill="#cf222e">Bluetooth Classic (SPP) — not available on iOS</text>
  <text class="lblm" x="50" y="538">iOS only exposes Bluetooth Classic serial to MFi accessories.</text>
  <text class="lblm" x="50" y="556">Apply on SPP says “Not available on iOS” rather than failing.</text>
  <text class="lblm" x="50" y="576">BLE: scanning for the Bitcraze service — first match is used.</text>

  <!-- ============================ sticks and sensitivity ============================ -->
  <text class="h2" x="448" y="212">Sticks and sensitivity</text>
  <text class="lblm" x="640" y="212">SettingsViewController</text>

  <rect class="bezel" x="448" y="226" width="376" height="374" rx="14"/>
  <rect class="screen" x="458" y="236" width="356" height="354" rx="8"/>

  <text class="lbl" x="472" y="262">Control sensitivity</text>
  <rect class="seg-on" x="472" y="272" width="72" height="22" rx="6"/><text class="lblm" x="508" y="287" text-anchor="middle">Slow</text>
  <rect class="seg" x="548" y="272" width="72" height="22" rx="6"/><text class="lblm" x="584" y="287" text-anchor="middle">Fast</text>
  <rect class="seg" x="624" y="272" width="80" height="22" rx="6"/><text class="lblm" x="664" y="287" text-anchor="middle">Custom</text>

  <text class="lbl" x="472" y="322">Pitch/roll (°/s)</text>
  <rect class="panel" x="472" y="330" width="100" height="24" rx="6"/><text class="mono" x="562" y="347" text-anchor="end">15</text>
  <text class="lbl" x="588" y="322">Thrust (%)</text>
  <rect class="panel" x="588" y="330" width="100" height="24" rx="6"/><text class="mono" x="678" y="347" text-anchor="end">80</text>
  <text class="lbl" x="704" y="322">Yaw rate (°/s)</text>
  <rect class="panel" x="704" y="330" width="96" height="24" rx="6"/><text class="mono" x="790" y="347" text-anchor="end">100</text>

  <text class="lbl" x="472" y="386">Control mode</text>
  <rect class="seg" x="472" y="396" width="58" height="22" rx="6"/><text class="lblm" x="501" y="411" text-anchor="middle">Mode 1</text>
  <rect class="seg" x="534" y="396" width="58" height="22" rx="6"/><text class="lblm" x="563" y="411" text-anchor="middle">Mode 2</text>
  <rect class="seg-on" x="596" y="396" width="58" height="22" rx="6"/><text class="lblm" x="625" y="411" text-anchor="middle">Mode 3</text>
  <rect class="seg" x="658" y="396" width="58" height="22" rx="6"/><text class="lblm" x="687" y="411" text-anchor="middle">Mode 4</text>
  <rect class="seg" x="720" y="396" width="66" height="22" rx="6"/><text class="lblm" x="753" y="411" text-anchor="middle">Tilt ▸</text>
  <text class="lblm" x="472" y="436">Tilt Mode appears only when the phone has motion hardware.</text>

  <!-- stick map 2x2 -->
  <rect class="panel" x="472" y="452" width="328" height="98" rx="8"/>
  <text class="lblm" x="536" y="472" text-anchor="middle">left stick</text>
  <text class="lblm" x="736" y="472" text-anchor="middle">right stick</text>
  <text class="lbl" x="536" y="492" text-anchor="middle">Pitch</text>
  <text class="lblm" x="536" y="508" text-anchor="middle">↓ ↑</text>
  <text class="lbl" x="536" y="528" text-anchor="middle">Roll</text>
  <text class="lblm" x="536" y="544" text-anchor="middle">← →</text>
  <text class="lbl" x="736" y="492" text-anchor="middle">Thrust</text>
  <text class="lblm" x="736" y="508" text-anchor="middle">↓ ↑</text>
  <text class="lbl" x="736" y="528" text-anchor="middle">Yaw</text>
  <text class="lblm" x="736" y="544" text-anchor="middle">← →</text>

  <rect class="btn-pri" x="576" y="560" width="120" height="26" rx="8"/><text class="lblw" x="636" y="577" text-anchor="middle">Close</text>
  <text class="lblm" x="716" y="577">saves and dismisses</text>
</svg>
