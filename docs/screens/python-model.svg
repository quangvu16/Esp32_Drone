<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 420" width="852" height="420" role="img" aria-labelledby="ttl desc">
  <title id="ttl">ESP-Drone Python tuner GUI — the Model window</title>
  <desc id="desc">The Auto-tune model window (ModelWindow): on the left the trial costs on a log axis with an x mark for each tipped trial and a step line for the best trial so far, and the model's best predicted cost as a dashed line; on the right the GP predicted cost over the first two tuned gains as a dark-better contour map with the tried points and a star at the model's best.</desc>

  <defs>
    <style>
      .bg      { fill: #f6f8fa; }
      .h2      { font: 700 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1f2328; }
      .lbl     { font: 500 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1f2328; }
      .lblm    { font: 400 12px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #57606a; }
      .mono    { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .win     { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .winbar  { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.5; }
      .panel   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .rule    { stroke: #d0d7de; stroke-width: 1; }
      .axis    { stroke: #57606a; stroke-width: 1.2; }
      .grid    { stroke: #d0d7de; stroke-width: 0.8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="852" height="420"/>

  <text class="h2" x="28" y="26">Model — what the search has learned</text>
  <text class="lblm" x="316" y="26">tuner_gui.py · ModelWindow · opened by Model in the Auto-tune panel</text>

  <rect class="win" x="28" y="40" width="796" height="360" rx="10"/>
  <rect class="winbar" x="28" y="40" width="796" height="28" rx="10"/>
  <text class="lbl" x="44" y="59">Auto-tune model</text>
  <circle cx="800" cy="54" r="5" fill="#8c959f"/>
  <circle cx="816" cy="54" r="5" fill="#8c959f"/>

  <!-- ============================ left: cost vs trial ============================ -->
  <rect class="panel" x="44" y="84" width="376" height="300" rx="6"/>
  <text class="lbl" x="60" y="104">Cost vs trial</text>
  <text class="lblm" x="152" y="104">log axis · x = tipped</text>

  <!-- axes -->
  <line class="axis" x1="88" y1="332" x2="396" y2="332"/>
  <line class="axis" x1="88" y1="120" x2="88" y2="332"/>
  <!-- y grid: 0.1 / 1 / 10 -->
  <line class="grid" x1="88" y1="160" x2="396" y2="160"/><text class="lblm" x="82" y="164" text-anchor="end">10</text>
  <line class="grid" x1="88" y1="228" x2="396" y2="228"/><text class="lblm" x="82" y="232" text-anchor="end">1</text>
  <line class="grid" x1="88" y1="296" x2="396" y2="296"/><text class="lblm" x="82" y="300" text-anchor="end">0.1</text>
  <text class="lblm" x="242" y="352" text-anchor="middle">trial</text>
  <text class="lblm" x="30" y="230" text-anchor="middle" transform="rotate(-90 30 230)">cost</text>

  <!-- trial trace: falls then bumps, one tip -->
  <polyline fill="none" stroke="#8c959f" stroke-width="1.2"
    points="100,180 124,196 148,188 172,214 196,206 220,236 244,228 268,252 292,244 316,262 340,258 364,270"/>
  <circle cx="100" cy="180" r="3.4" fill="#0969da"/>
  <circle cx="124" cy="196" r="3.4" fill="#0969da"/>
  <circle cx="148" cy="188" r="3.4" fill="#0969da"/>
  <circle cx="172" cy="214" r="3.4" fill="#0969da"/>
  <circle cx="196" cy="206" r="3.4" fill="#0969da"/>
  <path d="M216,232 l8,8 M224,232 l-8,8" stroke="#cf222e" stroke-width="2.2"/>
  <circle cx="244" cy="228" r="3.4" fill="#0969da"/>
  <circle cx="268" cy="252" r="3.4" fill="#0969da"/>
  <circle cx="292" cy="244" r="3.4" fill="#0969da"/>
  <circle cx="316" cy="262" r="3.4" fill="#0969da"/>
  <circle cx="340" cy="258" r="3.4" fill="#0969da"/>
  <circle cx="364" cy="270" r="3.4" fill="#0969da"/>
  <!-- best-so-far step -->
  <polyline fill="none" stroke="#1a7f37" stroke-width="1.6"
    points="88,180 124,180 124,196 148,196 148,188 172,188 172,214 220,214 220,236 268,236 268,252 316,252 316,262 396,262"/>
  <!-- model's best -->
  <line x1="88" y1="272" x2="396" y2="272" stroke="#1a7f37" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="lblm" x="392" y="268" text-anchor="end" fill="#1a7f37">model's best</text>
  <text class="lblm" x="150" y="128" fill="#1a7f37">best trial so far</text>
  <text class="lblm" x="220" y="128" fill="#8c959f">trial cost</text>

  <!-- ============================ right: predicted cost map ============================ -->
  <rect class="panel" x="436" y="84" width="376" height="300" rx="6"/>
  <text class="lbl" x="452" y="104">Predicted cost — dark = better</text>
  <text class="lblm" x="452" y="122">first two tuned gains · others at best</text>

  <!-- heatmap tiles: viridis-ish, dark centre (best) -->
  <rect x="500" y="136" width="288" height="188" fill="#fde725" opacity="0.25"/>
  <rect x="516" y="148" width="256" height="164" fill="#5ec962" opacity="0.35"/>
  <rect x="536" y="160" width="216" height="140" fill="#21918c" opacity="0.5"/>
  <rect x="558" y="174" width="172" height="112" fill="#31688e" opacity="0.65"/>
  <rect x="582" y="190" width="124" height="80" fill="#440154" opacity="0.8"/>
  <rect x="500" y="136" width="288" height="188" fill="none" stroke="#8c959f" stroke-width="1"/>

  <!-- tried points -->
  <circle cx="528" cy="180" r="3.6" fill="#0969da" stroke="#fff" stroke-width="0.8"/>
  <circle cx="560" cy="250" r="3.6" fill="#0969da" stroke="#fff" stroke-width="0.8"/>
  <circle cx="604" cy="212" r="3.6" fill="#0969da" stroke="#fff" stroke-width="0.8"/>
  <circle cx="648" cy="268" r="3.6" fill="#0969da" stroke="#fff" stroke-width="0.8"/>
  <circle cx="700" cy="192" r="3.6" fill="#8c959f" stroke="#fff" stroke-width="0.8"/>
  <path d="M740,296 l8,8 M748,296 l-8,8" stroke="#cf222e" stroke-width="2.2"/>
  <path d="M660,196 l7,-18 7,18 -18,-13 22,0 z" fill="#ffffff" stroke="#1f2328" stroke-width="1.1"/>
  <text class="lblm" x="672" y="196">model's best</text>

  <!-- axes -->
  <line class="axis" x1="472" y1="324" x2="800" y2="324"/>
  <line class="axis" x1="472" y1="136" x2="472" y2="324"/>
  <text class="lblm" x="636" y="344" text-anchor="middle">pid.roll_kp  (log)</text>
  <text class="lblm" x="452" y="230" text-anchor="middle" transform="rotate(-90 452 230)">pid.roll_kd  (log)</text>
  <text class="lblm" x="452" y="368">red = tipped · grey = past runs · band plot for a single gain</text>
  <text class="lblm" x="452" y="386">“the fit is for display only — the fit picks the result”</text>
</svg>
