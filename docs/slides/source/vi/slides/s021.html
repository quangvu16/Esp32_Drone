<h1 style="font-size:96px;font-weight:700;line-height:1.1">Các linh kiện phần cứng</h1>
<p style="font-size:40px;color:#BFC9D4;line-height:1.35">Mọi linh kiện trên bo mạch, chúng làm gì, và firmware nói chuyện với chúng thế nào.</p>
<aside>Phần 3 nói về bo mạch vật lý: ESP32, cảm biến chuyển động, đầu vào máy thu vô tuyến, công tắc động cơ, động cơ và pin. Mỗi linh kiện tương ứng với vài dòng trong firmware.</aside>
